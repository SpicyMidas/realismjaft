modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Seba"
# The Paper Glider's two-handed gliding arm pose (client only).
enumExtensions="META-INF/enumextensions.json"
description='''
Melatonia, Sleepyness and the Dreamland: sleep any time of day and dream on floating islands watched by Shades.
With Create: Tuff Gearshifts and the Latch Remote. With Farmer's Delight: dreamy dishes.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"
